<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="gearBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="rgbSpectrum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="75%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glowGear" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="480" height="320" rx="20" fill="url(#gearBg)"/>

  <circle cx="340" cy="160" r="110" fill="#f59e0b" opacity="0.25" filter="url(#glowGear)"/>

  <!-- Left: Gear Spec Badges -->
  <g transform="translate(36, 40)">
    <rect width="144" height="36" rx="18" fill="#3f3f46" opacity="0.6" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="72" y="23" text-anchor="middle" fill="#fef3c7" font-size="13" font-weight="900" font-family="Pretendard, system-ui, sans-serif">GAMING GEAR</text>

    <g transform="translate(0, 60)">
      <rect width="130" height="42" rx="10" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
      <text x="65" y="27" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="900" font-family="monospace">RGB SYNC</text>
    </g>

    <g transform="translate(0, 120)">
      <rect width="130" height="36" rx="8" fill="#18181b"/>
      <text x="65" y="23" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="800" font-family="monospace">WIRELESS 1K</text>
    </g>
  </g>

  <!-- Right: Mechanical RGB Keyboard & Ergonomic Mouse -->
  <g transform="translate(190, 50)">
    <!-- Keyboard Base -->
    <rect x="0" y="30" width="180" height="110" rx="10" fill="#09090b" stroke="#3f3f46" stroke-width="2.5"/>
    <!-- Keycap Matrix (Clean Aesthetic Grid) -->
    <g fill="#27272a" stroke="#52525b" stroke-width="1">
      <rect x="10" y="40" width="16" height="14" rx="2"/>
      <rect x="30" y="40" width="16" height="14" rx="2"/>
      <rect x="50" y="40" width="16" height="14" rx="2"/>
      <rect x="70" y="40" width="16" height="14" rx="2"/>
      <rect x="90" y="40" width="16" height="14" rx="2"/>
      <rect x="110" y="40" width="16" height="14" rx="2"/>
      <rect x="130" y="40" width="40" height="14" rx="2" fill="#f59e0b"/>

      <rect x="10" y="60" width="22" height="14" rx="2"/>
      <rect x="36" y="60" width="16" height="14" rx="2"/>
      <rect x="56" y="60" width="16" height="14" rx="2"/>
      <rect x="76" y="60" width="16" height="14" rx="2"/>
      <rect x="96" y="60" width="16" height="14" rx="2"/>
      <rect x="116" y="60" width="16" height="14" rx="2"/>
      <rect x="136" y="60" width="34" height="14" rx="2" fill="#06b6d4"/>

      <!-- Spacebar Row with Glowing Spectrum -->
      <rect x="10" y="80" width="28" height="14" rx="2"/>
      <rect x="44" y="80" width="80" height="14" rx="3" fill="url(#rgbSpectrum)" stroke="#22d3ee" stroke-width="1"/>
      <rect x="130" y="80" width="40" height="14" rx="2"/>
    </g>

    <!-- Wireless Gaming Mouse -->
    <g transform="translate(195, 40)">
      <ellipse cx="32" cy="55" rx="30" ry="48" fill="#09090b" stroke="#52525b" stroke-width="2.5"/>
      <rect x="28" y="24" width="8" height="22" rx="4" fill="#f59e0b"/>
      <line x1="32" y1="8" x2="32" y2="52" stroke="#3f3f46" stroke-width="2"/>
      <!-- Side RGB Light Guide -->
      <path d="M6 55 C6 85 18 100 32 102" fill="none" stroke="#06b6d4" stroke-width="3" filter="url(#glowGear)"/>
    </g>
  </g>
</svg>
