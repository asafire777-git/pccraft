<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="bgG2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="rainbowG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="75%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glowG" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#bgG2)"/>

  <circle cx="280" cy="110" r="70" fill="#f59e0b" opacity="0.2" filter="url(#glowG)"/>

  <!-- Left Content -->
  <g transform="translate(24, 26)">
    <rect width="138" height="28" rx="14" fill="#27272a" stroke="#f59e0b" stroke-width="1.2" opacity="0.95"/>
    <text x="14" y="18" fill="#fef3c7" font-size="11" font-weight="800" font-family="Pretendard, system-ui, sans-serif">⚡ 게이밍 기어전</text>
  </g>

  <text x="24" y="86" fill="#ffffff" font-size="20" font-weight="900" font-family="Pretendard, system-ui, sans-serif" letter-spacing="-0.5">
    로지텍 · 레이저
  </text>
  <text x="24" y="112" fill="url(#rainbowG)" font-size="19" font-weight="900" font-family="Pretendard, system-ui, sans-serif" letter-spacing="-0.5">
    기계식 키보드 &amp; 마우스
  </text>

  <g transform="translate(24, 132)">
    <rect width="148" height="22" rx="6" fill="#3f3f46" opacity="0.8"/>
    <text x="8" y="15" fill="#f4f4f5" font-size="10" font-weight="600" font-family="Pretendard, system-ui, sans-serif">
      초경량 무선 &amp; 핫스왑 축
    </text>
  </g>

  <g transform="translate(24, 164)">
    <rect width="134" height="32" rx="8" fill="#f59e0b"/>
    <text x="14" y="21" fill="#18181b" font-size="13" font-weight="900" font-family="Pretendard, system-ui, sans-serif">
      쿠팡 와우 특별할인
    </text>
  </g>
  <text x="24" y="218" fill="#a1a1aa" font-size="10" font-family="Pretendard, system-ui, sans-serif">
    * 프로게이머 실사용 센서 &amp; RGB 싱크
  </text>

  <!-- Right: Mechanical Keyboard & Mouse Visual -->
  <g transform="translate(200, 35)">
    <!-- Mechanical Keyboard Preview -->
    <rect x="0" y="30" width="135" height="75" rx="6" fill="#09090b" stroke="#3f3f46" stroke-width="1.8"/>
    <!-- Keycaps Matrix -->
    <g fill="#27272a" stroke="#52525b" stroke-width="0.8">
      <rect x="6" y="36" width="12" height="10" rx="1.5"/>
      <rect x="20" y="36" width="12" height="10" rx="1.5"/>
      <rect x="34" y="36" width="12" height="10" rx="1.5"/>
      <rect x="48" y="36" width="12" height="10" rx="1.5"/>
      <rect x="62" y="36" width="12" height="10" rx="1.5"/>
      <rect x="76" y="36" width="12" height="10" rx="1.5"/>
      <rect x="90" y="36" width="12" height="10" rx="1.5"/>
      <rect x="104" y="36" width="24" height="10" rx="1.5" fill="#f59e0b"/>

      <rect x="6" y="49" width="16" height="10" rx="1.5"/>
      <rect x="24" y="49" width="12" height="10" rx="1.5"/>
      <rect x="38" y="49" width="12" height="10" rx="1.5"/>
      <rect x="52" y="49" width="12" height="10" rx="1.5"/>
      <rect x="66" y="49" width="12" height="10" rx="1.5"/>
      <rect x="80" y="49" width="12" height="10" rx="1.5"/>
      <rect x="94" y="49" width="34" height="10" rx="1.5" fill="#06b6d4"/>

      <!-- Spacebar Row -->
      <rect x="6" y="62" width="22" height="10" rx="1.5"/>
      <rect x="31" y="62" width="60" height="10" rx="1.5" fill="url(#rainbowG)"/>
      <rect x="94" y="62" width="34" height="10" rx="1.5"/>
    </g>

    <!-- Ergonomic Wireless Mouse -->
    <g transform="translate(142, 40)">
      <rect x="0" y="0" width="46" height="74" rx="22" fill="#09090b" stroke="#52525b" stroke-width="1.8"/>
      <!-- Mouse Wheel & DPI Switch -->
      <rect x="20" y="14" width="6" height="16" rx="3" fill="#f59e0b"/>
      <line x1="23" y1="0" x2="23" y2="35" stroke="#3f3f46" stroke-width="1.5"/>
      <!-- Side RGB Strip -->
      <path d="M4 35 C4 55 12 68 23 70" fill="none" stroke="#06b6d4" stroke-width="2" filter="url(#glowG)"/>
    </g>
  </g>
</svg>
