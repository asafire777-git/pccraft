<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="gpcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a122c"/>
      <stop offset="50%" stop-color="#0f1f4b"/>
      <stop offset="100%" stop-color="#070c1e"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="neonMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glowF" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="480" height="320" rx="20" fill="url(#gpcBg)"/>

  <!-- Tech Perspective Grid Lines -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1.2">
    <path d="M0 60 H480 M0 120 H480 M0 180 H480 M0 240 H480"/>
    <path d="M60 0 V320 M120 0 V320 M180 0 V320 M240 0 V320 M300 0 V320 M360 0 V320 M420 0 V320"/>
  </g>

  <!-- Ambient Glow Halos -->
  <circle cx="280" cy="150" r="110" fill="#06b6d4" opacity="0.3" filter="url(#glowF)"/>
  <circle cx="380" cy="200" r="80" fill="#ec4899" opacity="0.25" filter="url(#glowF)"/>

  <!-- Left: Stylized Emblem & Rocket Visual -->
  <g transform="translate(36, 40)">
    <!-- High-impact rocket delivery badge emblem -->
    <rect width="140" height="36" rx="18" fill="#e11d48" opacity="0.2" stroke="#f43f5e" stroke-width="1.5"/>
    <path d="M22 24 L27 19 M25 15 C29 11 34 11 34 11 C34 11 34 16 30 20 C26 24 22 24 22 24 Z" fill="#ef4444"/>
    <circle cx="20" cy="26" r="3" fill="#fbbf24"/>
    <text x="46" y="23" fill="#ffffff" font-size="13" font-weight="900" font-family="Pretendard, system-ui, sans-serif">로켓배송</text>

    <!-- Large Decorative Cyber Elements -->
    <g transform="translate(0, 60)">
      <circle cx="16" cy="16" r="16" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="16" cy="16" r="6" fill="#22d3ee" filter="url(#glowF)"/>
      <text x="40" y="21" fill="#f8fafc" font-size="14" font-weight="900" font-family="monospace">CUSTOM GAMING</text>
    </g>

    <g transform="translate(0, 105)">
      <rect width="140" height="28" rx="8" fill="#1e293b" opacity="0.8"/>
      <text x="12" y="19" fill="#38bdf8" font-size="12" font-weight="800" font-family="monospace">ULTRA EDITION</text>
    </g>
  </g>

  <!-- Center-Right: 3D High-End Panoramic Gaming Desktop Tower -->
  <g transform="translate(200, 30)">
    <!-- Shadow underneath -->
    <ellipse cx="140" cy="270" rx="100" ry="12" fill="#020617" opacity="0.7"/>

    <!-- Case Outer Frame (Dual-Chamber Panoramic Tempered Glass) -->
    <rect x="30" y="20" width="200" height="245" rx="14" fill="#0b1120" stroke="#334155" stroke-width="3"/>
    <rect x="35" y="25" width="190" height="235" rx="10" fill="url(#glassReflection)"/>

    <!-- Glass Reflection Highlights -->
    <path d="M45 28 L195 210 L180 250 L35 60 Z" fill="#ffffff" opacity="0.06"/>

    <!-- Top ARGB Exhaust Fans (3-Fan Array) -->
    <g transform="translate(45, 36)">
      <!-- Fan 1 -->
      <circle cx="25" cy="20" r="18" fill="#020617" stroke="#22d3ee" stroke-width="2.5"/>
      <circle cx="25" cy="20" r="9" fill="#06b6d4" opacity="0.9" filter="url(#glowF)"/>
      <!-- Fan 2 -->
      <circle cx="75" cy="20" r="18" fill="#020617" stroke="#38bdf8" stroke-width="2.5"/>
      <circle cx="75" cy="20" r="9" fill="#38bdf8" opacity="0.9" filter="url(#glowF)"/>
      <!-- Fan 3 -->
      <circle cx="125" cy="20" r="18" fill="#020617" stroke="#a855f7" stroke-width="2.5"/>
      <circle cx="125" cy="20" r="9" fill="#a855f7" opacity="0.9" filter="url(#glowF)"/>
    </g>

    <!-- Liquid Cooler CPU AIO Block with Digital Temp Display -->
    <g transform="translate(80, 100)">
      <circle cx="26" cy="26" r="24" fill="#020617" stroke="#ec4899" stroke-width="3"/>
      <circle cx="26" cy="26" r="14" fill="url(#neonMagenta)" opacity="0.8" filter="url(#glowF)"/>
      <text x="26" y="31" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="900" font-family="monospace">36°C</text>
      <!-- Sleeved Tubes -->
      <path d="M46 20 C70 15 80 40 100 35" fill="none" stroke="#475569" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M44 32 C66 30 74 52 96 46" fill="none" stroke="#334155" stroke-width="4.5" stroke-linecap="round"/>
    </g>

    <!-- DDR5 High-Speed RGB RAM Sticks -->
    <rect x="145" y="90" width="6" height="42" rx="3" fill="#22d3ee" filter="url(#glowF)"/>
    <rect x="156" y="90" width="6" height="42" rx="3" fill="#ec4899" filter="url(#glowF)"/>

    <!-- High-End Triple-Fan Graphics Card with Glowing RGB Accent -->
    <g transform="translate(48, 160)">
      <rect x="0" y="0" width="165" height="50" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
      <!-- GPU Top RGB Strip -->
      <rect x="15" y="6" width="135" height="5" rx="2.5" fill="url(#neonCyan)" filter="url(#glowF)"/>
      <text x="18" y="26" fill="#f8fafc" font-size="11" font-weight="900" font-family="monospace">RTX 40 SERIES</text>
      <!-- GPU Fan Previews -->
      <circle cx="130" cy="30" r="14" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="130" cy="30" r="5" fill="#38bdf8"/>
    </g>

    <!-- Bottom RGB Intake Fans -->
    <circle cx="85" cy="235" r="14" fill="#020617" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="140" cy="235" r="14" fill="#020617" stroke="#22d3ee" stroke-width="2"/>
  </g>

  <!-- Ambient Light Sparks -->
  <path d="M220 50 L224 60 L234 64 L224 68 L220 78 L216 68 L206 64 L216 60 Z" fill="#38bdf8" opacity="0.9"/>
  <path d="M430 110 L433 118 L441 121 L433 124 L430 132 L427 124 L419 121 L427 118 Z" fill="#ec4899" opacity="0.8"/>
</svg>
