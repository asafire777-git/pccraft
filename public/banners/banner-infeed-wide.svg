<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="infBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a132c"/>
      <stop offset="50%" stop-color="#142145"/>
      <stop offset="100%" stop-color="#070c1e"/>
    </linearGradient>
    <linearGradient id="infCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glowInf" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="720" height="240" rx="16" fill="url(#infBg)"/>

  <!-- Tech Grid Background Lines -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1.2">
    <line x1="0" y1="60" x2="720" y2="60"/>
    <line x1="0" y1="120" x2="720" y2="120"/>
    <line x1="0" y1="180" x2="720" y2="180"/>
  </g>

  <!-- Glowing Orbs -->
  <circle cx="200" cy="120" r="90" fill="#06b6d4" opacity="0.25" filter="url(#glowInf)"/>
  <circle cx="540" cy="120" r="100" fill="#a855f7" opacity="0.25" filter="url(#glowInf)"/>

  <!-- Left: Panoramic Desktop PC Showcase -->
  <g transform="translate(40, 20)">
    <rect x="20" y="15" width="140" height="175" rx="10" fill="#0b1120" stroke="#334155" stroke-width="2.5"/>
    <rect x="24" y="19" width="132" height="167" rx="8" fill="#0f172a"/>
    <circle cx="65" cy="45" r="16" fill="#020617" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="65" cy="45" r="7" fill="#06b6d4" filter="url(#glowInf)"/>
    <circle cx="115" cy="45" r="16" fill="#020617" stroke="#ec4899" stroke-width="2"/>
    <circle cx="115" cy="45" r="7" fill="#ec4899" filter="url(#glowInf)"/>
    <!-- GPU -->
    <rect x="35" y="105" width="110" height="35" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <rect x="42" y="112" width="75" height="3" fill="url(#infCyan)" filter="url(#glowInf)"/>
  </g>

  <!-- Center: Triple Fan High-End GPU -->
  <g transform="translate(250, 45)">
    <rect x="0" y="15" width="220" height="110" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <circle cx="45" cy="70" r="32" fill="#020617" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="45" cy="70" r="10" fill="#38bdf8"/>
    <circle cx="110" cy="70" r="32" fill="#020617" stroke="#ec4899" stroke-width="2.5"/>
    <circle cx="110" cy="70" r="10" fill="#ec4899"/>
    <circle cx="175" cy="70" r="32" fill="#020617" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="175" cy="70" r="10" fill="#38bdf8"/>
    <rect x="30" y="125" width="110" height="6" fill="#fbbf24"/>
  </g>

  <!-- Right: AM5 CPU & NVMe SSD Showcase -->
  <g transform="translate(520, 40)">
    <!-- CPU -->
    <rect x="15" y="15" width="75" height="75" rx="8" fill="#065f46" stroke="#10b981" stroke-width="2"/>
    <rect x="24" y="24" width="57" height="57" rx="4" fill="#cbd5e1"/>
    <text x="52" y="58" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="900" font-family="monospace">AM5</text>
    <!-- NVMe SSD -->
    <rect x="15" y="105" width="140" height="40" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="85" y="130" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="900" font-family="monospace">PCIe 4.0 1TB</text>
  </g>
</svg>
