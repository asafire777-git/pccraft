<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="wideBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="35%" stop-color="#1c2541"/>
      <stop offset="70%" stop-color="#141c38"/>
      <stop offset="100%" stop-color="#090f24"/>
    </linearGradient>
    <linearGradient id="rocketRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="cyanText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="wideGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1000" height="180" rx="16" fill="url(#wideBg)"/>

  <!-- Background Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1.5">
    <line x1="0" y1="30" x2="1000" y2="30"/>
    <line x1="0" y1="90" x2="1000" y2="90"/>
    <line x1="0" y1="150" x2="1000" y2="150"/>
  </g>

  <!-- Left Side: Coupang Rocket Logo Emblem & Badges -->
  <g transform="translate(36, 32)">
    <!-- Rocket Badge -->
    <rect width="148" height="30" rx="15" fill="#e11d48" opacity="0.15" stroke="#f43f5e" stroke-width="1.2"/>
    <!-- Rocket Shape -->
    <g transform="translate(14, 7)">
      <path d="M4 14 L8 9 M7 6 C10 3 13 3 13 3 C13 3 13 6 10 9 C7 12 4 12 4 12 Z" fill="#ef4444"/>
      <circle cx="3" cy="15" r="2" fill="#fbbf24"/>
    </g>
    <text x="36" y="20" fill="#fecdd3" font-size="12" font-weight="900" font-family="Pretendard, system-ui, sans-serif">
      쿠팡 로켓 기획전
    </text>

    <!-- Main Heading -->
    <text x="0" y="66" fill="#ffffff" font-size="24" font-weight="900" font-family="Pretendard, system-ui, sans-serif" letter-spacing="-0.5">
      2026 PC 하드웨어 &amp; 완본체 슈퍼 페스타
    </text>

    <!-- Subtitle -->
    <text x="0" y="96" fill="#94a3b8" font-size="13" font-weight="500" font-family="Pretendard, system-ui, sans-serif">
      CPU · RTX 40 시리즈 · SSD · 게이밍 모니터 실시간 최저가 및 카드사 무이자 혜택
    </text>
  </g>

  <!-- Center Highlight Tags -->
  <g transform="translate(480, 48)">
    <rect width="130" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="18" fill="#38bdf8" font-size="11" font-weight="700" font-family="Pretendard, system-ui, sans-serif">✓ 오늘 주문 내일 도착</text>

    <rect x="0" y="38" width="130" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="56" fill="#34d399" font-size="11" font-weight="700" font-family="Pretendard, system-ui, sans-serif">✓ 무료배송 · 안심반품</text>
  </g>

  <!-- Right Visual & CTA Button Area -->
  <g transform="translate(640, 24)">
    <!-- Hardware Art Graphic -->
    <!-- GPU Graphic Miniature -->
    <g transform="translate(20, 18)">
      <rect width="120" height="50" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
      <circle cx="28" cy="25" r="16" fill="#020617" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="60" cy="25" r="16" fill="#020617" stroke="#ec4899" stroke-width="1.5"/>
      <circle cx="92" cy="25" r="16" fill="#020617" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="25" y="4" width="70" height="3" fill="#38bdf8" filter="url(#wideGlow)"/>
    </g>
    <!-- RAM sticks -->
    <rect x="150" y="24" width="4" height="36" rx="2" fill="#06b6d4" filter="url(#wideGlow)"/>
    <rect x="158" y="24" width="4" height="36" rx="2" fill="#a855f7" filter="url(#wideGlow)"/>

    <!-- CTA Button Preview -->
    <g transform="translate(180, 42)">
      <rect width="140" height="46" rx="12" fill="url(#cyanText)"/>
      <text x="24" y="28" fill="#0b132b" font-size="13" font-weight="900" font-family="Pretendard, system-ui, sans-serif">
        기획전 바로가기 →
      </text>
    </g>
  </g>
</svg>
