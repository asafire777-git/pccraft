<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="bgE1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#021f18"/>
    </linearGradient>
    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glowE" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" rx="16" fill="url(#bgE1)"/>

  <!-- Subtle Diamond Mesh -->
  <g opacity="0.1" stroke="#34d399" stroke-width="1">
    <path d="M50 0 L400 350 M150 0 L400 250 M250 0 L400 150 M0 50 L350 400 M0 150 L250 400"/>
  </g>

  <circle cx="280" cy="110" r="70" fill="#10b981" opacity="0.25" filter="url(#glowE)"/>

  <!-- Left: Content & Badges -->
  <g transform="translate(24, 26)">
    <rect width="132" height="28" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="1.2" opacity="0.95"/>
    <path d="M14 18 L18 13 L24 16 L20 21 Z" fill="#34d399"/>
    <text x="32" y="18" fill="#d1fae5" font-size="11" font-weight="800" font-family="Pretendard, system-ui, sans-serif">완본체 브랜드전</text>
  </g>

  <text x="24" y="86" fill="#ffffff" font-size="20" font-weight="900" font-family="Pretendard, system-ui, sans-serif" letter-spacing="-0.5">
    가성비 완제품 PC
  </text>
  <text x="24" y="112" fill="url(#emeraldNeon)" font-size="19" font-weight="900" font-family="Pretendard, system-ui, sans-serif" letter-spacing="-0.5">
    원클릭 세팅 특가
  </text>

  <g transform="translate(24, 132)">
    <rect width="148" height="22" rx="6" fill="#065f46" opacity="0.8"/>
    <text x="8" y="15" fill="#a7f3d0" font-size="10" font-weight="600" font-family="Pretendard, system-ui, sans-serif">
      롤·발로란트·배그 완벽 방어
    </text>
  </g>

  <g transform="translate(24, 164)">
    <rect width="134" height="32" rx="8" fill="url(#emeraldNeon)"/>
    <text x="12" y="21" fill="#022c22" font-size="13" font-weight="900" font-family="Pretendard, system-ui, sans-serif">
      1년 무상 A/S 보증
    </text>
  </g>
  <text x="24" y="218" fill="#6ee7b7" opacity="0.8" font-size="10" font-family="Pretendard, system-ui, sans-serif">
    * 윈도우 정품 탑재 및 완제품 조립출고
  </text>

  <!-- Right: Clean Minimalist White PC Tower + Curved Display -->
  <g transform="translate(210, 25)">
    <!-- Sleek Tower Case (White Minimal) -->
    <rect x="50" y="15" width="115" height="175" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Glass Window Inner -->
    <rect x="56" y="22" width="103" height="161" rx="6" fill="#0f172a"/>
    <!-- Internal Green/Cyan Ambient Light -->
    <circle cx="85" cy="50" r="15" fill="#10b981" opacity="0.8" filter="url(#glowE)"/>
    <circle cx="125" cy="50" r="15" fill="#06b6d4" opacity="0.8" filter="url(#glowE)"/>
    <!-- CPU Air Cooler Fan -->
    <circle cx="88" cy="95" r="22" fill="#020617" stroke="#34d399" stroke-width="2"/>
    <circle cx="88" cy="95" r="7" fill="#6ee7b7"/>
    <!-- GPU Card -->
    <rect x="62" y="130" width="90" height="26" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="68" y="137" width="55" height="3" rx="1.5" fill="#34d399" filter="url(#glowE)"/>
    <!-- Desk Shadow -->
    <ellipse cx="107" cy="195" rx="55" ry="6" fill="#000000" opacity="0.4"/>
  </g>
</svg>
