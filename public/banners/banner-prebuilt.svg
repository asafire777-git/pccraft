<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="pbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#021d17"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glowPb" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="480" height="320" rx="20" fill="url(#pbBg)"/>

  <circle cx="340" cy="160" r="110" fill="#10b981" opacity="0.3" filter="url(#glowPb)"/>

  <!-- Left: Prebuilt Badges -->
  <g transform="translate(36, 40)">
    <rect width="144" height="36" rx="18" fill="#065f46" opacity="0.6" stroke="#34d399" stroke-width="1.5"/>
    <text x="72" y="23" text-anchor="middle" fill="#d1fae5" font-size="13" font-weight="900" font-family="Pretendard, system-ui, sans-serif">PREBUILT PC</text>

    <g transform="translate(0, 60)">
      <rect width="130" height="42" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
      <text x="65" y="27" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="900" font-family="monospace">WINDOWS 11</text>
    </g>

    <g transform="translate(0, 120)">
      <rect width="130" height="36" rx="8" fill="#022c22"/>
      <text x="65" y="23" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="800" font-family="monospace">1-YEAR A/S</text>
    </g>
  </g>

  <!-- Right: Clean Minimalist White PC Tower with Panoramic Window -->
  <g transform="translate(210, 35)">
    <ellipse cx="120" cy="255" rx="85" ry="12" fill="#021d17" opacity="0.7"/>

    <!-- White Tower Case -->
    <rect x="35" y="20" width="170" height="235" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="42" y="28" width="156" height="219" rx="8" fill="#0f172a"/>

    <!-- Internal Green/Cyan Ambient Light -->
    <circle cx="85" cy="70" r="22" fill="#10b981" opacity="0.8" filter="url(#glowPb)"/>
    <circle cx="145" cy="70" r="22" fill="#06b6d4" opacity="0.8" filter="url(#glowPb)"/>

    <!-- CPU Tower Air Cooler with Dual RGB Fans -->
    <circle cx="95" cy="130" r="32" fill="#020617" stroke="#34d399" stroke-width="3"/>
    <circle cx="95" cy="130" r="10" fill="#6ee7b7"/>

    <!-- GPU Card -->
    <rect x="52" y="175" width="135" height="36" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.8"/>
    <rect x="62" y="185" width="80" height="4" rx="2" fill="#34d399" filter="url(#glowPb)"/>
  </g>
</svg>
