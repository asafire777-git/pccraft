<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="hwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16082c"/>
      <stop offset="50%" stop-color="#241142"/>
      <stop offset="100%" stop-color="#0e041c"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="goldPins" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glowHw" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="480" height="320" rx="20" fill="url(#hwBg)"/>

  <!-- Circuit Trace Background Pattern -->
  <g opacity="0.18" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round">
    <path d="M20 70 H90 L120 100 H220"/>
    <path d="M50 250 H120 L150 220 H260"/>
    <circle cx="220" cy="100" r="4" fill="#c084fc"/>
    <circle cx="260" cy="220" r="4" fill="#c084fc"/>
    <path d="M300 40 V90 L330 120 V200"/>
    <circle cx="330" cy="200" r="4" fill="#ec4899"/>
  </g>

  <circle cx="340" cy="160" r="110" fill="#a855f7" opacity="0.3" filter="url(#glowHw)"/>

  <!-- Left: Emblem Visual -->
  <g transform="translate(36, 40)">
    <rect width="144" height="36" rx="18" fill="#581c87" opacity="0.4" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="8" fill="#a855f7"/>
    <path d="M16 18 L19 21 L24 15" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="36" y="23" fill="#f3e8ff" font-size="13" font-weight="900" font-family="Pretendard, system-ui, sans-serif">HARDWARE</text>

    <!-- AM5 CPU Processor Module -->
    <g transform="translate(0, 75)">
      <rect width="130" height="130" rx="12" fill="#065f46" stroke="#10b981" stroke-width="2.5"/>
      <rect x="15" y="15" width="100" height="100" rx="8" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
      <text x="65" y="60" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="900" font-family="monospace">RYZEN</text>
      <text x="65" y="82" text-anchor="middle" fill="#475569" font-size="14" font-weight="bold" font-family="monospace">7000 / 9000</text>
      <circle cx="10" cy="10" r="3" fill="#fbbf24"/>
    </g>
  </g>

  <!-- Right: Triple Fan Graphics Card & NVMe SSD -->
  <g transform="translate(200, 45)">
    <!-- Triple Fan Graphics Card -->
    <g transform="translate(0, 0)">
      <!-- Main Shroud -->
      <rect x="0" y="20" width="245" height="110" rx="12" fill="#0f172a" stroke="#64748b" stroke-width="2.5"/>
      <!-- Metallic Heatpipe Accents -->
      <path d="M25 20 V10 H220 V20" stroke="#94a3b8" stroke-width="4" fill="none"/>
      <!-- Fan 1 -->
      <circle cx="48" cy="75" r="36" fill="#020617" stroke="#a855f7" stroke-width="3"/>
      <circle cx="48" cy="75" r="11" fill="#c084fc"/>
      <!-- Fan 2 -->
      <circle cx="122" cy="75" r="36" fill="#020617" stroke="#ec4899" stroke-width="3"/>
      <circle cx="122" cy="75" r="11" fill="#f472b6"/>
      <!-- Fan 3 -->
      <circle cx="196" cy="75" r="36" fill="#020617" stroke="#a855f7" stroke-width="3"/>
      <circle cx="196" cy="75" r="11" fill="#c084fc"/>
      <!-- Gold PCIe Pins -->
      <rect x="35" y="130" width="110" height="7" fill="url(#goldPins)"/>
    </g>

    <!-- NVMe M.2 High Speed SSD with Ribbed Aluminum Heatsink -->
    <g transform="translate(10, 160)">
      <rect width="215" height="56" rx="8" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
      <rect x="15" y="8" width="170" height="40" rx="4" fill="#1e293b"/>
      <!-- Heatsink Fin Grid -->
      <line x1="30" y1="12" x2="30" y2="44" stroke="#38bdf8" stroke-width="3"/>
      <line x1="50" y1="12" x2="50" y2="44" stroke="#38bdf8" stroke-width="3"/>
      <line x1="70" y1="12" x2="70" y2="44" stroke="#38bdf8" stroke-width="3"/>
      <text x="125" y="33" fill="#e2e8f0" font-size="13" font-weight="900" font-family="monospace">NVMe SSD 1TB</text>
      <!-- M.2 Gold Interface Pins -->
      <rect x="195" y="14" width="8" height="28" fill="url(#goldPins)"/>
    </g>
  </g>
</svg>
