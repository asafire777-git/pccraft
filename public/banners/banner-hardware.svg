<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="bgH1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160829"/>
      <stop offset="50%" stop-color="#1e103c"/>
      <stop offset="100%" stop-color="#0d041a"/>
    </linearGradient>
    <linearGradient id="purpleG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="gpuGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glowH" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" rx="16" fill="url(#bgH1)"/>

  <!-- Circuit Trace Pattern -->
  <g opacity="0.15" stroke="#c084fc" stroke-width="1.2" stroke-linecap="round">
    <path d="M10 50 H60 L80 70 H150"/>
    <path d="M40 180 H90 L110 160 H180"/>
    <circle cx="150" cy="70" r="3" fill="#c084fc"/>
    <circle cx="180" cy="160" r="3" fill="#c084fc"/>
    <path d="M220 30 V60 L240 80 V130"/>
    <circle cx="240" cy="130" r="3" fill="#ec4899"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="290" cy="120" r="75" fill="#a855f7" opacity="0.25" filter="url(#glowH)"/>

  <!-- Left: Promotional Typography & Badges -->
  <g transform="translate(24, 26)">
    <rect width="138" height="28" rx="14" fill="#1e103c" stroke="#a855f7" stroke-width="1.2" opacity="0.95"/>
    <circle cx="14" cy="14" r="6" fill="#a855f7"/>
    <path d="M12 14 L14 16 L17 12" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <text x="28" y="18" fill="#f3e8ff" font-size="11" font-weight="800" font-family="Pretendard, system-ui, sans-serif">하드웨어 특가전</text>
  </g>

  <text x="24" y="86" fill="#ffffff" font-size="20" font-weight="900" font-family="Pretendard, system-ui, sans-serif" letter-spacing="-0.5">
    PC 핵심 부품
  </text>
  <text x="24" y="112" fill="url(#purpleG)" font-size="19" font-weight="900" font-family="Pretendard, system-ui, sans-serif" letter-spacing="-0.5">
    CPU · 그래픽 · SSD
  </text>

  <g transform="translate(24, 132)">
    <rect width="154" height="22" rx="6" fill="#2e1065" opacity="0.8"/>
    <text x="8" y="15" fill="#d8b4fe" font-size="10" font-weight="600" font-family="Pretendard, system-ui, sans-serif">
      라이젠 7500F · RTX 40 · M.2 NVMe
    </text>
  </g>

  <g transform="translate(24, 164)">
    <rect width="134" height="32" rx="8" fill="url(#purpleG)"/>
    <text x="12" y="21" fill="#ffffff" font-size="13" font-weight="900" font-family="Pretendard, system-ui, sans-serif">
      로켓배송 무료반품
    </text>
  </g>
  <text x="24" y="218" fill="#a855f7" opacity="0.8" font-size="10" font-family="Pretendard, system-ui, sans-serif">
    * 내일 아침 문 앞 도착 보장 상품
  </text>

  <!-- Right: Hardware Components Visual (GPU + CPU Processor + NVMe SSD) -->
  <g transform="translate(200, 20)">
    <!-- Triple Fan Graphics Card Illustration -->
    <g transform="translate(10, 20)">
      <!-- GPU Main Body -->
      <rect x="0" y="10" width="170" height="74" rx="8" fill="url(#chipGrad)" stroke="#64748b" stroke-width="1.8"/>
      <!-- Fan 1 -->
      <circle cx="34" cy="47" r="24" fill="#020617" stroke="#a855f7" stroke-width="2"/>
      <circle cx="34" cy="47" r="7" fill="#c084fc"/>
      <path d="M34 27 L34 40 M34 54 L34 67 M14 47 L27 47 M41 47 L54 47" stroke="#475569" stroke-width="2"/>
      <!-- Fan 2 -->
      <circle cx="85" cy="47" r="24" fill="#020617" stroke="#ec4899" stroke-width="2"/>
      <circle cx="85" cy="47" r="7" fill="#f472b6"/>
      <path d="M85 27 L85 40 M85 54 L85 67 M65 47 L78 47 M92 47 L105 47" stroke="#475569" stroke-width="2"/>
      <!-- Fan 3 -->
      <circle cx="136" cy="47" r="24" fill="#020617" stroke="#a855f7" stroke-width="2"/>
      <circle cx="136" cy="47" r="7" fill="#c084fc"/>
      <path d="M136 27 L136 40 M136 54 L136 67 M116 47 L129 47 M143 47 L156 47" stroke="#475569" stroke-width="2"/>
      <!-- Top Metal Heatpipes -->
      <path d="M20 10 V4 H150 V10" stroke="#94a3b8" stroke-width="3" fill="none"/>
      <!-- PCIe Gold Fingers -->
      <rect x="25" y="84" width="70" height="5" fill="url(#gpuGold)"/>
    </g>

    <!-- CPU Processor Socket Unit (AM5 Style) -->
    <g transform="translate(25, 110)">
      <rect x="0" y="0" width="56" height="56" rx="4" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
      <rect x="7" y="7" width="42" height="42" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
      <text x="28" y="27" text-anchor="middle" fill="#0f172a" font-size="7" font-weight="900" font-family="monospace">RYZEN</text>
      <text x="28" y="37" text-anchor="middle" fill="#475569" font-size="6" font-family="monospace">7500F</text>
      <circle cx="4" cy="4" r="1.5" fill="#fbbf24"/>
    </g>

    <!-- NVMe M.2 SSD Stick with Heatsink -->
    <g transform="translate(95, 125)">
      <rect x="0" y="0" width="82" height="26" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
      <rect x="8" y="4" width="58" height="18" rx="2" fill="#1e293b"/>
      <!-- Heatsink Fins -->
      <line x1="14" y1="6" x2="14" y2="20" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="22" y1="6" x2="22" y2="20" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="30" y1="6" x2="30" y2="20" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="42" y="16" fill="#e2e8f0" font-size="6" font-weight="bold" font-family="monospace">1TB NVMe</text>
      <!-- M.2 Gold Pins -->
      <rect x="76" y="5" width="4" height="16" fill="url(#gpuGold)"/>
    </g>
  </g>
</svg>
