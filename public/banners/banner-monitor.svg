<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="monBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082845"/>
      <stop offset="50%" stop-color="#0e3a63"/>
      <stop offset="100%" stop-color="#04182b"/>
    </linearGradient>
    <linearGradient id="neonCyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="vividScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#4f46e5"/>
      <stop offset="80%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glowMon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="480" height="320" rx="20" fill="url(#monBg)"/>

  <circle cx="280" cy="150" r="110" fill="#38bdf8" opacity="0.3" filter="url(#glowMon)"/>

  <!-- Left: Display Spec Badges -->
  <g transform="translate(36, 40)">
    <rect width="144" height="36" rx="18" fill="#0c4a6e" opacity="0.6" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="72" y="23" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="900" font-family="Pretendard, system-ui, sans-serif">GAMING MONITOR</text>

    <g transform="translate(0, 60)">
      <rect width="130" height="42" rx="10" fill="#0369a1" opacity="0.4" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="65" y="27" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="900" font-family="monospace">240Hz / 1ms</text>
    </g>

    <g transform="translate(0, 120)">
      <rect width="130" height="36" rx="8" fill="#1e293b" opacity="0.8"/>
      <text x="65" y="23" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="800" font-family="monospace">QHD IPS HDR</text>
    </g>
  </g>

  <!-- Right: Large Curved Ultra-Wide Gaming Monitor with Ergonomic Stand -->
  <g transform="translate(180, 45)">
    <!-- Stand Shadow -->
    <ellipse cx="140" cy="245" rx="85" ry="10" fill="#020617" opacity="0.6"/>

    <!-- Heavy Metal Stand -->
    <path d="M90 238 L140 215 L190 238 Z" fill="#334155"/>
    <rect x="135" y="160" width="10" height="60" rx="4" fill="#475569"/>

    <!-- Monitor Outer Curved Bezel -->
    <rect x="15" y="20" width="250" height="150" rx="10" fill="#0f172a" stroke="#475569" stroke-width="3"/>

    <!-- Glowing Screen Display -->
    <rect x="20" y="25" width="240" height="140" rx="8" fill="url(#vividScreen)"/>

    <!-- Screen Landscape Cyber Horizon -->
    <circle cx="140" cy="95" r="32" fill="#ffffff" opacity="0.25"/>
    <path d="M20 120 C80 90 160 145 260 110 V165 H20 Z" fill="#020617" opacity="0.65"/>

    <!-- 240Hz Overlay Pill on Screen -->
    <rect x="190" y="32" width="62" height="22" rx="6" fill="#0f172a" opacity="0.85"/>
    <text x="221" y="47" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="900" font-family="monospace">240Hz</text>
  </g>
</svg>
