<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="bgM1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="50%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#031f33"/>
    </linearGradient>
    <linearGradient id="blueNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glowM" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#bgM1)"/>

  <circle cx="280" cy="110" r="70" fill="#38bdf8" opacity="0.25" filter="url(#glowM)"/>

  <!-- Left Content -->
  <g transform="translate(24, 26)">
    <rect width="138" height="28" rx="14" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
    <text x="14" y="18" fill="#e0f2fe" font-size="11" font-weight="800" font-family="Pretendard, system-ui, sans-serif">🖥️ 게이밍 모니터전</text>
  </g>

  <text x="24" y="86" fill="#ffffff" font-size="20" font-weight="900" font-family="Pretendard, system-ui, sans-serif" letter-spacing="-0.5">
    QHD · 144Hz~240Hz
  </text>
  <text x="24" y="112" fill="url(#blueNeon)" font-size="19" font-weight="900" font-family="Pretendard, system-ui, sans-serif" letter-spacing="-0.5">
    울트라기어 &amp; 오디세이
  </text>

  <g transform="translate(24, 132)">
    <rect width="146" height="22" rx="6" fill="#0369a1" opacity="0.8"/>
    <text x="8" y="15" fill="#bae6fd" font-size="10" font-weight="600" font-family="Pretendard, system-ui, sans-serif">
      IPS 패널 · 1ms 반응속도
    </text>
  </g>

  <g transform="translate(24, 164)">
    <rect width="134" height="32" rx="8" fill="url(#blueNeon)"/>
    <text x="14" y="21" fill="#082f49" font-size="13" font-weight="900" font-family="Pretendard, system-ui, sans-serif">
      로켓배송 무료설치
    </text>
  </g>
  <text x="24" y="218" fill="#7dd3fc" opacity="0.8" font-size="10" font-family="Pretendard, system-ui, sans-serif">
    * 불량화소 100% 무결점 보증 행사
  </text>

  <!-- Right: Gaming Monitor Graphic -->
  <g transform="translate(195, 25)">
    <!-- Monitor Bezel & Stand -->
    <!-- Stand Base -->
    <path d="M70 178 L100 155 L130 178 Z" fill="#334155"/>
    <rect x="96" y="125" width="8" height="32" fill="#475569"/>
    <!-- Curved Frame -->
    <rect x="15" y="20" width="170" height="105" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <!-- Vivid Curved Screen Display -->
    <rect x="18" y="23" width="164" height="99" rx="4" fill="url(#screenGrad)"/>
    <!-- Screen Elements / Game Scene Graphic -->
    <circle cx="100" cy="72" r="24" fill="#ffffff" opacity="0.2"/>
    <path d="M18 90 C60 70 120 110 182 85 V122 H18 Z" fill="#020617" opacity="0.6"/>
    <!-- Refresh rate badge on display -->
    <rect x="135" y="28" width="42" height="16" rx="4" fill="#0f172a" opacity="0.85"/>
    <text x="156" y="40" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="900" font-family="monospace">240Hz</text>
  </g>
</svg>
